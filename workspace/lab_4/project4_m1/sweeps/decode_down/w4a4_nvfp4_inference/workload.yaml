workload:
  iteration_space_shape:
    m: 0 <= m < 1
    'no': 0 <= no < 32
    ni: 0 <= ni < 128
    kbo: 0 <= kbo < 43
    kbi: 0 <= kbi < 16
    ki: 0 <= ki < 16
  bits_per_value:
    A: 16
    Sga: 32
    Ascl: 16
    Sba: 8
    Aq: 4
    Wq: 4
    Sbw: 8
    Sgw: 32
    Yraw: 32
    Ytmp: 32
    Yblk: 32
    Ytmp2: 32
    Y: 16
  einsums:
  - name: TensorScaleA
    tensor_accesses:
    - name: A
      projection:
      - m
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Sga
      projection: &id001
      - m
      output: true
  - name: TensorQuantA
    tensor_accesses:
    - name: A
      projection:
      - m
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Sga
      projection: *id001
      density: 1.0
    - name: Ascl
      projection:
      - m
      - kbo
      - kbi
      - ki
      output: true
  - name: BlockScaleA
    tensor_accesses:
    - name: Ascl
      projection:
      - m
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Sba
      projection:
      - m
      - kbo
      - kbi
      output: true
  - name: BlockQuantA
    tensor_accesses:
    - name: Ascl
      projection:
      - m
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Sba
      projection:
      - m
      - kbo
      - kbi
      density: 1.0
    - name: Aq
      projection:
      - m
      - kbo
      - kbi
      - ki
      output: true
  - name: MatMulNVFP4
    tensor_accesses:
    - name: Aq
      projection:
      - m
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Wq
      projection:
      - 'no'
      - ni
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Yraw
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      output: true
  - name: RescaleBlockA
    tensor_accesses:
    - name: Yraw
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      density: 1.0
    - name: Sba
      projection:
      - m
      - kbo
      - kbi
      density: 1.0
    - name: Ytmp
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      output: true
  - name: RescaleBlockW
    tensor_accesses:
    - name: Ytmp
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      density: 1.0
    - name: Sbw
      projection:
      - 'no'
      - ni
      - kbo
      - kbi
      density: 1.0
    - name: Yblk
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      output: true
  - name: RescaleTensorA
    tensor_accesses:
    - name: Yblk
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      density: 1.0
    - name: Sga
      projection: *id001
      density: 1.0
    - name: Ytmp2
      projection:
      - m
      - 'no'
      - ni
      output: true
  - name: RescaleTensorW
    tensor_accesses:
    - name: Ytmp2
      projection:
      - m
      - 'no'
      - ni
      density: 1.0
    - name: Sgw
      projection:
      - 'no'
      - ni
      density: 1.0
    - name: Y
      projection:
      - m
      - 'no'
      - ni
      output: true
