workload:
  iteration_space_shape:
    m: 0 <= m < 128
    'no': 0 <= no < 32
    ni: 0 <= ni < 128
    kbo: 0 <= kbo < 43
    kbi: 0 <= kbi < 16
    ki: 0 <= ki < 16
  bits_per_value:
    Aq: 4
    Wq: 4
    Yraw: 32
  einsums:
  - name: MatMulNVFP4
    tensor_accesses:
    - name: Aq
      projection:
      - m
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Wq
      projection:
      - 'no'
      - ni
      - kbo
      - kbi
      - ki
      density: 1.0
    - name: Yraw
      projection:
      - m
      - 'no'
      - ni
      - kbo
      - kbi
      output: true
