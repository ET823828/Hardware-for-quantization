arch:
  # =================================================================
  # Parameterized NVFP4 accelerator — 45nm, 0.9V
  # Energy: Horowitz ISSCC 2014; Area: TSMC 45nm 6T SRAM
  #
  # Parameters (passed via jinja_parse_data):
  #   GLB_SIZE  : GLB capacity in bits      (default 524288 = 64KB)
  #   RF_SIZE   : RF capacity per PE in bits (default 1024 = 128B)
  #   PE_X      : spatial X fanout           (default 8)
  #   PE_Y      : spatial Y fanout           (default 8)
  #   DRAM_BW   : DRAM actions/cycle         (default 8)
  #   GLB_BW    : GLB actions/cycle          (default 32)
  #
  # =================================================================
  nodes:

  # ======================== DRAM (off-chip) =======================
  - !Memory
    name: DRAM
    size: 99999999999
    leak_power: 0
    area: 0
    total_latency: "ceil(max((read_actions + metadata_read_actions) / {{ DRAM_BW }}, (write_actions + metadata_write_actions) / {{ DRAM_BW }}))"
    tensors: {keep: ~Intermediates, may_keep: All}
    actions:
    - {name: read, energy: 10.0, bits_per_action: 64, latency: 0}
    - {name: write, energy: 10.0, bits_per_action: 64, latency: 0}
    - {name: metadata_read, energy: 2.0, bits_per_action: 16, latency: 0}
    - {name: metadata_write, energy: 2.0, bits_per_action: 16, latency: 0}

  # ======================== GLB (on-chip SRAM) ====================
  # Horowitz: 8KB SRAM = 5 pJ/32b, 32KB = 10 pJ/32b
  # Area: bits × 0.296 um²/bit (6T cell) × 2.5 (peripherals)
  #      = bits × 7.4e-13 m²
  - !Memory
    name: GLB
    size: {{ GLB_SIZE }}
    leak_power: 0
    area: {{ GLB_SIZE * 7.4e-13 }}
    total_latency: "ceil(max(total_read_actions / {{ GLB_BW }}, total_write_actions / {{ GLB_BW }}))"
    tensors: {keep: ~DRAM, may_keep: All}
    actions:
    - {name: read, energy: 5.0, bits_per_action: 32, latency: 0}
    - {name: write, energy: 5.0, bits_per_action: 32, latency: 0}
    - {name: metadata_read, energy: 2.0, bits_per_action: 16, latency: 0}
    - {name: metadata_write, energy: 2.0, bits_per_action: 16, latency: 0}

  # ======================== RF (per-PE register file) =============
  # Area per PE: bits × 1e-12 m² (register file with R/W ports)
  - !Memory
    name: RF
    size: {{ RF_SIZE }}
    leak_power: 0
    area: {{ RF_SIZE * 1e-12 }}
    total_latency: "ceil(max(total_read_actions / 2, total_write_actions / 2))"
    tensors: {may_keep: All}
    spatial:
    - {name: X, fanout: {{ PE_X }}}
    - {name: Y, fanout: {{ PE_Y }}}
    actions:
    - {name: read, energy: 1.0, bits_per_action: 32, latency: 0}
    - {name: write, energy: 1.0, bits_per_action: 32, latency: 0}

  # ======================== QuantMAC (FP16 quant ops) =============
  # Horowitz: 16b FP multiply ≈ 1.0 pJ; area ≈ 90 um² = 9e-11 m²
  # Handles: TensorScale/Quant, BlockScale/Quant (A & W), DequantW
  - !Compute
    name: QuantMAC
    enabled: "'Ascl' in All or 'Wscl' in All or 'Sw' in All or ('A' in All and 'Sga' in All) or ('W' in All and 'Sgw' in All)"
    leak_power: 0
    area: 9e-11
    actions:
    - {name: compute, energy: 1.0, latency: 1}

  # ======================== FP4MAC (FP4×FP4 + FP32 accum) ========
  # Horowitz: 8b Int Mult = 0.2 pJ; area ≈ 60 um² = 6e-11 m²
  # Handles: MatMulNVFP4 only (Aq × Wq → Yraw)
  - !Compute
    name: FP4MAC
    enabled: "'Aq' in All and 'Wq' in All"
    leak_power: 0
    area: 6e-11
    actions:
    - {name: compute, energy: 0.2, latency: 1}

  # ======================== RescaleMAC (FP32 rescale) =============
  # Horowitz: 32b FP Mult = 3.7 pJ; area ≈ 720 um² = 7.2e-10 m²
  # Handles: RescaleBlockA/W, RescaleTensorA/W
  - !Compute
    name: RescaleMAC
    enabled: "('Yraw' in All and 'Sba' in All) or ('Ytmp' in All and 'Sbw' in All) or ('Yblk' in All and 'Sga' in All) or ('Ytmp2' in All and 'Sgw' in All)"
    leak_power: 0
    area: 7.2e-10
    actions:
    - {name: compute, energy: 3.7, latency: 2}

  # ======================== FP16MAC (FP16 multiply-accumulate) =========
  # Handles: Baseline MatMul (A,W,Y) and weight-only MatMulQ (A,Wdq,Y)
  - !Compute
    name: FP16MAC
    enabled: "'A' in All and 'Y' in All"
    leak_power: 0
    area: 9e-11
    actions:
    - {name: compute, energy: 1.0, latency: 1}
