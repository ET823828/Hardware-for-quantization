arch:
  nodes:
  - !Memory
    name: DRAM
    size: 99999999999
    leak_power: 0
    area: 0
    total_latency: "ceil(max((read_actions + metadata_read_actions) / 8, (write_actions + metadata_write_actions) / 8))"
    tensors: {keep: ~Intermediates, may_keep: All}
    actions:
    - {name: read, energy: 10.0, bits_per_action: 64, latency: 0}
    - {name: write, energy: 10.0, bits_per_action: 64, latency: 0}
    - {name: metadata_read, energy: 2.0, bits_per_action: 16, latency: 0}
    - {name: metadata_write, energy: 2.0, bits_per_action: 16, latency: 0}

  - !Memory
    name: GLB
    size: 524288
    leak_power: 0
    area: 3.8797312e-07
    total_latency: "ceil(max(total_read_actions / 32, total_write_actions / 32))"
    tensors: {keep: ~DRAM, may_keep: All}
    actions:
    - {name: read, energy: 5.0, bits_per_action: 32, latency: 0}
    - {name: write, energy: 5.0, bits_per_action: 32, latency: 0}
    - {name: metadata_read, energy: 2.0, bits_per_action: 16, latency: 0}
    - {name: metadata_write, energy: 2.0, bits_per_action: 16, latency: 0}

  - !Memory
    name: RF
    size: 1024
    leak_power: 0
    area: 1.024e-09
    total_latency: "ceil(max(total_read_actions / 2, total_write_actions / 2))"
    tensors: {may_keep: All}
    spatial:
    - {name: X, fanout: 8}
    - {name: Y, fanout: 8}
    actions:
    - {name: read, energy: 1.0, bits_per_action: 32, latency: 0}
    - {name: write, energy: 1.0, bits_per_action: 32, latency: 0}

  - !Compute
    name: QuantMAC
    enabled: "('Wq' in All and 'Sw' in All and 'Wdq' in All) or ('Sba' in All and ('A' in All or 'Ascl' in All)) or ('Sbw' in All and ('W' in All or 'Wscl' in All)) or ('Sga' in All and 'A' in All) or ('Sgw' in All and 'W' in All)"
    leak_power: 0
    area: 9e-11
    total_latency: "ceil(compute_latency / 1)"
    actions:
    - {name: compute, energy: 1.0, latency: 1}

  - !Compute
    name: FP4MAC
    enabled: "'Aq' in All and 'Wq' in All"
    leak_power: 0
    area: 6e-11
    actions:
    - {name: compute, energy: 0.2, latency: 1}

  - !Compute
    name: RescaleFineMAC
    enabled: "('Yraw' in All and 'Sba' in All) or ('Ytmp' in All and 'Sbw' in All)"
    leak_power: 0
    area: 1e-11
    total_latency: "ceil(compute_latency / 1)"
    actions:
    - {name: compute, energy: 0.03, latency: 1}

  - !Compute
    name: RescaleCoarseMAC
    enabled: "('Yblk' in All and 'Sga' in All) or ('Ytmp2' in All and 'Sgw' in All)"
    leak_power: 0
    area: 1e-11
    total_latency: "ceil(compute_latency / 1)"
    actions:
    - {name: compute, energy: 0.03, latency: 1}

  - !Compute
    name: FP16MAC
    enabled: "('A' in All and 'Y' in All and 'W' in All) or ('A' in All and 'Y' in All and 'Wdq' in All)"
    leak_power: 0
    area: 9e-11
    actions:
    - {name: compute, energy: 1.0, latency: 1}
