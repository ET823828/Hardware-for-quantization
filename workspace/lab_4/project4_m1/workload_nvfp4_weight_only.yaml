workload:
  iteration_space_shape:
    m: 0 <= m < 64
    n: 0 <= n < 64
    kb: 0 <= kb < 8
    ki: 0 <= ki < 16
  bits_per_value:
    A: 16
    Wq: 4
    Sw: 16
    Wdq: 16
    Y: 16
  einsums:
  - name: DequantW
    tensor_accesses:
    - name: Wq
      projection:
      - n
      - kb
      - ki
      density: 1.0
    - name: Sw
      projection:
      - n
      - kb
      density: 1.0
    - name: Wdq
      projection:
      - n
      - kb
      - ki
      output: true
  - name: MatMulQ
    tensor_accesses:
    - name: A
      projection:
      - m
      - kb
      - ki
      density: 1.0
    - name: Wdq
      projection:
      - n
      - kb
      - ki
      density: 1.0
    - name: Y
      projection:
      - m
      - n
      output: true
