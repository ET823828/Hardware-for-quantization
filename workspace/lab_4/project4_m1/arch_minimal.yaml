arch:
  # =================================================================
  # All values: 45nm CMOS, 0.9V
  #
  # Energy:  Horowitz, ISSCC 2014, "Computing's Energy Problem"
  # Area:    TSMC 45nm 6T SRAM cell = 0.296 um^2/bit;
  #          FP16 MAC ~90 um^2 (lab3 die-photo estimate);
  #          multiplier area ~ mantissa_bits^2 (Google TPU paper)
  # Latency: pipelined throughput; FP32 = 2 cycles (longer path)
  # =================================================================
  nodes:

  # =================================================================
  # DRAM (off-chip)
  # =================================================================
  # Horowitz: DRAM random access ~1.3-2.6 nJ.
  # Simplified to 10 pJ/64b for burst-mode amortized cost
  # (consistent with AccelForge lab framework).
  - !Memory
    name: DRAM
    size: 99999999999
    leak_power: 0
    area: 0
    total_latency: "ceil(max((read_actions + metadata_read_actions) / 8, (write_actions + metadata_write_actions) / 8))"
    tensors: {keep: ~Intermediates, may_keep: All}
    actions:
    - {name: read, energy: 10.0, bits_per_action: 64, latency: 0}
    - {name: write, energy: 10.0, bits_per_action: 64, latency: 0}
    - {name: metadata_read, energy: 2.0, bits_per_action: 16, latency: 0}
    - {name: metadata_write, energy: 2.0, bits_per_action: 16, latency: 0}

  # =================================================================
  # GLB (Global Buffer — 64 KB on-chip SRAM)
  # =================================================================
  # Horowitz: 8KB SRAM = 5 pJ/32b read, 32KB = 10 pJ/32b.
  # 64KB scratchpad (no tag compare): ~5 pJ/32b.
  # Area: 524288 bits × 0.296 um^2/bit = 0.155 mm^2 (cells)
  #       + ~2.5x peripherals ≈ 0.4 mm^2 = 4e-7 m^2.
  - !Memory
    name: GLB
    size: 524288
    leak_power: 0
    area: 4e-7
    total_latency: "ceil(max(total_read_actions / 32, total_write_actions / 32))"
    tensors: {keep: ~DRAM, may_keep: All}
    actions:
    - {name: read, energy: 5.0, bits_per_action: 32, latency: 0}
    - {name: write, energy: 5.0, bits_per_action: 32, latency: 0}
    - {name: metadata_read, energy: 2.0, bits_per_action: 16, latency: 0}
    - {name: metadata_write, energy: 2.0, bits_per_action: 16, latency: 0}

  # =================================================================
  # RF (Register File — per-PE, 128 B, 2D spatial 8×8 = 64 PEs)
  # =================================================================
  # Horowitz: register file ~1 pJ/32b (small, no sense amps).
  # Area per PE: 1024 bits × ~1 um^2/bit (with R/W ports)
  #            = 1024 um^2 = 1e-9 m^2.
  # Total RF area (64 PEs) ≈ 0.066 mm^2.
  - !Memory
    name: RF
    size: 1024
    leak_power: 0
    area: 1e-9
    total_latency: "ceil(max(total_read_actions / 2, total_write_actions / 2))"
    tensors: {may_keep: All}
    spatial:
    - {name: X, fanout: 8}
    - {name: Y, fanout: 8}
    actions:
    - {name: read, energy: 1.0, bits_per_action: 32, latency: 0}
    - {name: write, energy: 1.0, bits_per_action: 32, latency: 0}

  # =================================================================
  # QuantMAC — quantization compute (FP16 scale/quantize)
  # =================================================================
  # Handles: TensorScale, TensorQuant, BlockScale, BlockQuant (A & W)
  # Energy: Horowitz 16b FP multiply ≈ 1.0 pJ
  # Area:   FP16 MAC ≈ 90 um^2 = 9e-11 m^2 (lab3 reference)
  # Latency: 1 cycle (pipelined FP16)
  - !Compute
    name: QuantMAC
    leak_power: 0
    area: 9e-11
    actions:
    - {name: compute, energy: 1.0, latency: 1}

  # =================================================================
  # FP4MAC — FP4×FP4 matrix multiply with FP32 accumulate
  # =================================================================
  # Handles: MatMulNVFP4 (75.7% of total compute)
  # Energy: Horowitz 8b Int Mult = 0.2 pJ; FP4 (1-bit mantissa)
  #         is even simpler. 0.2 pJ is conservative.
  # Area:   FP4 multiplier is trivial (~5 um^2), dominated by
  #         FP32 accumulator adder (~50 um^2).
  #         Total ≈ 60 um^2 = 6e-11 m^2.
  # Latency: 1 cycle (FP4 mult is very fast)
  - !Compute
    name: FP4MAC
    leak_power: 0
    area: 6e-11
    actions:
    - {name: compute, energy: 0.2, latency: 1}

  # =================================================================
  # RescaleMAC — FP32 rescaling (undo quantization scales)
  # =================================================================
  # Handles: RescaleBlockA/W, RescaleTensorA/W
  # Energy: Horowitz 32b FP Multiply = 3.7 pJ
  # Area:   FP32 multiplier ≈ 8× FP16 (mantissa^2 scaling)
  #         = 8 × 90 = 720 um^2 = 7.2e-10 m^2.
  # Latency: 2 cycles (FP32 has ~2× critical path vs FP16)
  - !Compute
    name: RescaleMAC
    leak_power: 0
    area: 7.2e-10
    actions:
    - {name: compute, energy: 3.7, latency: 2}
